name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifest JSON
        run: python -m json.tool manifest.json >/dev/null
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
